server:
  port: 8080
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${JPA_DB_URL:jdbc:mysql://localhost:3306/menudb}
    username: ${JPA_DB_USERNAME:who307}
    password: ${JPA_DB_PASSWORD:who307}
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
