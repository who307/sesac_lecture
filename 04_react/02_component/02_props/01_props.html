<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <title>Document</title>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        /**
        * Props: 부모 컴포넌트가 자식 컴포넌트에게 데이터를 전달하는 "통로"
        * - 읽기 전용 데이터이다.(자식은 Props를 수정할 수 없음)
        * - 데이터는 항상 위에서 아래로 흐름(부모 -> 자식)
        * - 함수의 매개변수처럼 생각하면 쉬움 부모가 값을 넘기고, 자식은 받은 값을 사용한다.
        */
        function Greeting({ name = "기본이름", favoriteNumber = "1", children }) {
            return (
                <>
                    {/* JSX 내부 주석 */}
                    <h1>안녕하세요, {name}님!</h1>
                    <h2>제가 좋아하는 숫자는 {favoriteNumber}</h2>
                    <strong>전달된 자식 요소(children): {children}</strong>
                </>
            )
        }
        function App() {
            const name1 = "홍길동";
            const name2 = "유관순";

            return (
                <>
                    {/* 태그 사이에 작성한 내용은 props.children으로 전달 된다.*/}
                    <Greeting name={name1} favoriteNumber={5}>props 공부 중! </Greeting>
                    <Greeting name={name2} favoriteNumber={7}>
                        <div>여러 줄도 가능</div>
                        <div>React</div>
                    </Greeting>
                    <Greeting>props를 넘기지 않으면 기본값이 적용됩니다.</Greeting>
                </>
            )
        }
        const root = ReactDOM.createRoot(document.getElementById("root"))
        root.render(<App />);

    </script>
</body>
</html>
