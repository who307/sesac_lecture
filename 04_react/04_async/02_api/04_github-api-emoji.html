<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이모지 검색기</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .cardList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .card {
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
        }

        .cardEmoji {
            width: 48px;
            height: 48px;
        }

        .cardName {
            margin-top: 8px;
            font-size: 14px;
            word-break: break-all;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = 'https://api.github.com/emojis';

        // 사용자 입력을 받는 검색 상자 컴포넌트
        function SearchBox({ inputValue, inputHandler, searchHandler }) {
            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    searchHandler();
                }
            };

            return (
                <div>
                    <input 
                        type="text" 
                        value={inputValue} 
                        placeholder="이모지 이름을 입력하세요." 
                        onChange={inputHandler}
                        onKeyDown={handleKeyDown}
                    />
                    <button onClick={searchHandler}>검색</button>
                </div>
            );
        }

        // 검색 결과 및 로딩/에러 상태를 시각화하는 컴포넌트
        function ImageBox({ searchData, loading, error }) {
            if (loading) {
                return <div>이모지 목록을 불러오는 중입니다...</div>;
            }

            if (error) {
                return <div>오류 발생: {error.message}</div>;
            }

            if (!searchData || searchData.length === 0) {
                return <div>검색 결과가 없습니다.</div>;
            }

            return (
                <div className="cardList">
                    {searchData.map((item) => (
                        <div key={item.name} className="card">
                            <img src={item.url} alt={item.name} className="cardEmoji" />
                            <span className="cardName">{item.name}</span>
                        </div>
                    ))}
                </div>
            );
        }

        // 전체 상태와 API 통신을 제어하는 메인 App 컴포넌트
        function App() {
            const [error, setError] = useState(null);
            const [loading, setLoading] = useState(true);
            const [data, setData] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [searchData, setSearchData] = useState([]);

            useEffect(() => {
                const getAPI = async () => {
                    try {
                        setLoading(true);
                        const res = await fetch(API_URL);

                        if (!res.ok) {
                            throw new Error('이모지 데이터를 불러올 수 없습니다.');
                        }

                        const imagesData = await res.json();
                        const formattedData = Object.entries(imagesData).map(([name, url]) => ({
                            name,
                            url,
                        }));

                        setData(formattedData);
                    } catch (err) {
                        console.error(err);
                        setError(err);
                    } finally {
                        setLoading(false);
                    }
                };
                getAPI();
            }, []);

            const inputHandler = (e) => {
                setInputValue(e.target.value);
            };

            const searchHandler = () => {
                const query = inputValue.trim().toLowerCase();

                // 검색어가 없으면 전체 목록 복원
                if (!query) {
                    return;
                }

                // 대소문자 미구분 부분 검색
                const result = data.filter((image) =>
                    image.name.toLowerCase().includes(query)
                );

                setSearchData(result);
            };

            return (
                <div style={{ padding: '20px' }}>
                    <h1>이모지 검색기</h1>
                    <SearchBox 
                        inputValue={inputValue} 
                        inputHandler={inputHandler} 
                        searchHandler={searchHandler} 
                    />
                    <br />
                    <ImageBox error={error} loading={loading} searchData={searchData} />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
