<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <title>Document</title>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React; // 객체 구조 분해 할당

        function MessageManager() {
            // useState 호출 : [ 상태 값, 상태 변경 함수 ] = useState(초기값);
            const [message, setMessage] = useState('초기 상태 메세지입니다.');
            const [textColor, setTextColor] = useState('black');

            // 상태 변경 함수(Setter)를 호출하면 -> 컴포넌트가 '리렌더링'된다.(새로고침X)
            // 컴포넌트 함수가 다시 실행되면서 변경된 state 값으로 JSX가 다시 만들어진다
            console.log('MessageManager 컴포넌트가 렌더링 되었습니다.');

            const handleEnter = () => {
                setMessage('안녕하세요! 환영합니다.');
                setTextColor('blue');
            }

            const handleLeave = () => {
                setMessage('안녕히 가세요! 다음에 또 만나요~');
                setTextColor('red');

            }
            return (
                <>
                    <h1>함수형 컴포넌트 (useState)</h1>
                    <h2 style={{ color: textColor }}>{message}</h2>
                    <button onClick={handleEnter}>입장</button>
                    <button onClick={handleLeave}>퇴장</button>
                </>
            )
        }

        function App() {
            /*
                useState Hook
                - Hook : 함수형 컴포넌트가 React의 기능을 사용할 수 있게 연결해주는 함수
                - 함수형 컴포넌트에서 State를 사용할 수 있게 해주는 함수이다
            */
            const [count, setCount] = useState(0);
            const countButton = useRef();

            const countUp = () => {
                setCount(prev => prev + 1);
            }

            return (
                <>
                    <MessageManager />

                    <p>{count}</p>
                    <button ref={countButton} className="countUp" onClick={countUp}>카운트 증가</button>
                </>
            )
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />)
    </script>
</body>

</html>
