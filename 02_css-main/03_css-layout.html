<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레이아웃</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            border: 3px solid black;
        }

        .item {
            padding: 10px;
            text-align: center;
            color: white;
            box-sizing: border-box;
        }

        .item.red {
            background-color: red;
        }

        .item.green {
            background-color: rgb(46, 255, 46);
        }

        .item.blue {
            background-color: blue;
        }

        /*
            flex는 한 방향으로 요소를 배치할 때 많이 사용
            예를 들어 메뉴를 가로로 나열하건, 버튼들을 한줄로 정렬할 때 유용하다
            주축 방향의 정렬은 justify-content, 교차축 방향의 정렬은 align-items로 조절한다.
        */
        .flex-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 150px;
            flex-wrap: wrap;
        }

        .grid-container {
            display: grid;
            /* 사용 가능한 공간을 1:1:1 비율로 나눈 3개의 열을 만듦 */
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .grid-container .item:first-of-type {
            grid-column: 1 / 3;

        }
        .position-container{
            position: relative;
            height:200px;
        }
        .position-container .blue{
            position: absolute;
            bottom:0;
            right:0;

        }
        .position-container .green{
            position: absolute;
            top: 0;
            left:0;
        }
    </style>
</head>

<body>
    <h1>1. Flexbox로 배치하기 (가장 많이 사용!)</h1>
    <div class="container flex-container">
        <div class="item red">Item 1</div>
        <div class="item green">Item 2</div>
        <div class="item blue">Item 3</div>
        <div class="item red">Item 4</div>
        <div class="item green">Item 5</div>
    </div>

    <h1>Grid로 배치하기</h1>
    <div class="container grid-container">
        <div class="item red">Item 1</div>
        <div class="item green">Item 2</div>
        <div class="item blue">Item 3</div>
        <div class="item red">Item 4</div>
        <div class="item green">Item 5</div>
    </div>

    <h1>Position으로 배치하기</h1>
    <div class="container position-container">
        <div class="item blue">Absolute Position</div>
        <div class="item green">Absolute Position</div>
    </div>
</body>

</html>
