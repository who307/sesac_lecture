<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Todo List 실습</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 60px 20px;
            color: #222;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: #f4f6fa;
        }

        #root {
            width: min(680px, 100%);
        }

        .practice-guide,
        .todo-app {
            padding: 24px;
            border: 1px solid #dfe4ea;
            border-radius: 14px;
            background: white;
        }

        .practice-guide {
            margin-bottom: 24px;
        }

        .practice-guide h1 {
            margin-top: 0;
        }

        .requirements {
            padding: 16px 18px 16px 38px;
            border-radius: 8px;
            line-height: 1.7;
            background: #f1f4ff;
        }

        .todo-app h2 {
            margin-top: 0;
        }

        .input-area {
            display: flex;
            gap: 8px;
        }

        .input-area input {
            flex: 1;
            min-width: 0;
            padding: 11px;
            border: 1px solid #ced6e0;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 9px 14px;
            border: 0;
            border-radius: 6px;
            color: white;
            background: #315efb;
            cursor: pointer;
        }

        .todo-list {
            padding: 0;
            list-style: none;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            padding: 12px 14px;
            border: 1px solid #dfe4ea;
            border-radius: 8px;
        }

        .todo-item button {
            background: #d63031;
        }

        .count {
            color: #596275;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        // 할 일 한 개를 화면에 표시하는 자식 컴포넌트
        function TodoItem({ todo : {text , isDone}, onRemove, onToggle }) {

            return (
                <li className="todo-item">
                    <input type='checkbox' onChange={onToggle} checked={isDone} />

                    <span style={isDone ? { textDecoration: "line-through" } : undefined}>{text}</span>
                    <button onClick={onRemove}>
                        삭제
                    </button>
                </li>
            );
        }

        // 할 일 목록과 상태를 관리하는 부모 컴포넌트
        function TodoList() {
            // TODO 3. 입력값을 저장할 inputText state를 만드세요. 초기값은 빈 문자열입니다.
            const [inputText, setInputText] = useState('');
            const inputRef = useRef(null);

            // TODO 4. 할 일 목록을 저장할 todos state를 만드세요.
            // 초기값은 아래 객체 두 개를 가진 배열입니다.
            // { id: 1, text: 'React 복습하기' }
            // { id: 2, text: 'Todo List 완성하기' }
            const [todos, setTodos] = useState([
                { id: 1, text: 'React 복습하기', isDone: false },
                { id: 2, text: 'Todo List 완성하기', isDone: false }
            ])

            // TODO 5. 다음 할 일의 id로 사용할 nextId state를 만드세요. 초기값은 3입니다.
            const [nextId, setNextId] = useState(3);

            const handleChange = (e) => {
                // TODO 6. input의 현재 값을 inputText state에 저장하세요.
                setInputText(e.target.value);
            };

            const handleAdd = () => {
                // TODO 7. inputText의 앞뒤 공백을 제거했을 때 빈 문자열이면 함수를 종료하세요.
                if (inputText.trim() === '') return;
                // TODO 8. id와 text를 가진 새로운 할 일 객체를 만드세요.
                const newTodos = {
                    id: nextId,
                    text: inputText,
                    isDone: false
                };
                // TODO 9. 기존 todos를 직접 수정하지 말고 Spread 문법으로 새 할 일을 추가하세요.
                setTodos([...todos, newTodos])
                // TODO 10. nextId를 1 증가시키고 inputText를 빈 문자열로 초기화하세요.
                setNextId(nextId + 1);
                setInputText('');
                inputRef.current?.focus();

            };

            const handleRemove = (id) => {
                // TODO 11. filter를 사용해 전달받은 id와 다른 할 일만 남기세요.
                const updateTodos = todos.filter(todo => todo.id !== id)
                setTodos(updateTodos);
            };

            const handleToggle = (id) => {
                // 1) todos.map(...)으로 새로운 배열을 만듭니다.
                // 2) todo.id === id인 항목을 찾습니다.
                // 3) 찾은 객체는 아래처럼 새 객체로 만듭니다.
                //    { ...todo, isDone: !todo.isDone }
                // 4) id가 다른 todo는 기존 객체를 그대로 반환합니다.
                // 5) 완성된 배열을 setTodos에 전달합니다.

                const newArray = todos.map(todo => {
                    if (todo.id === id) {
                        return { ...todo, isDone: !todo.isDone };
                    }
                    return todo;
                })
                setTodos(newArray);

            };
            return (
                <>
                    <section className="practice-guide">
                        <h1>React Todo List 실습</h1>
                        <ol className="requirements">
                            <li>input의 값은 <code>inputText</code> state로 관리합니다.</li>
                            <li>할 일 목록은 객체 배열 형태의 <code>todos</code> state로 관리합니다.</li>
                            <li>추가 버튼을 누르면 새로운 할 일을 기존 목록 뒤에 추가합니다.</li>
                            <li>공백만 입력한 경우에는 할 일을 추가하지 않습니다.</li>
                            <li><code>map()</code>으로 할 일 목록을 렌더링하고 각 li에 고유한 <code>key</code>를 지정합니다.</li>
                            <li>삭제 버튼을 누르면 <code>filter()</code>로 해당 할 일을 제외합니다.</li>
                            <li>할 일 한 개의 화면은 자식 컴포넌트인 <code>TodoItem</code>이 담당합니다.</li>
                            <li>부모는 자식에게 <code>todo</code>와 삭제 함수 <code>handleRemove</code>를 props로 전달합니다.</li>
                            <li>자식은 삭제 버튼을 클릭하면 전달받은 함수를 <code>todo.id</code>와 함께 호출합니다.</li>
                        </ol>
                    </section>

                    <main className="todo-app">
                        <h2>오늘의 할 일</h2>
                        <div className="input-area">
                            <input ref ={inputRef}
                                type="text"
                                placeholder="할 일을 입력하세요"
                                value={inputText}
                                onChange={handleChange}
                            />
                            <button onClick={handleAdd}>추가</button>
                        </div>

                        <p className="count">남은 할 일: {todos.filter(todo => !todo.isDone).length} </p>

                        <ul className="todo-list">
                            {/* TODO 16. todos를 map으로 순회하며 TodoItem을 렌더링하세요. */}


                            {todos.map(todo =>
                                <TodoItem key={todo.id} todo={todo} onRemove={() => handleRemove(todo.id)} onToggle={() => { handleToggle(todo.id) }} />
                            )}
                        </ul>
                    </main>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<TodoList />);
    </script>
</body>

</html>
